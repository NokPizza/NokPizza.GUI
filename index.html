    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          var dark = saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.className = 'dark';
        } catch (_) {}
      })();
    </script>
    <style>
      body {
        margin: 0;
        background: #f8f9fb;
        color: #111827;
        font-family:
          'Inter Variable',
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
      }
      html.dark body {
        background: #1f2937;
        color: #f8f9fb;
      }
      #root {
        min-height: 100svh;
        display: flex;
        flex-direction: column;
      }
      .sk-header {
        height: 4.5rem;
        border-bottom: 1px solid rgba(17, 24, 39, 0.08);
      }
      html.dark .sk-header {
        border-bottom-color: rgba(248, 249, 251, 0.08);
      }
      .sk-page {
        flex: 1;
        display: flex;
        flex-direction: column;
      }
      .sk-hero {
        height: 380px;
        background: #1a1208;
      }
      .sk-app {
        position: relative;
        z-index: 1;
        max-width: 560px;
        width: 100%;
        margin: -2.5rem auto 0;
        padding: 0 1rem 2rem;
        box-sizing: border-box;
      }
      .sk-card {
        display: flex;
        flex-direction: column;
        gap: 1.75rem;
        background: #f8f9fb;
        border: 1px solid rgba(17, 24, 39, 0.1);
        border-radius: 1.25rem;
        padding: 2rem;
        box-shadow:
          0 4px 6px rgba(17, 24, 39, 0.04),
          0 12px 40px rgba(17, 24, 39, 0.1);
      }
      html.dark .sk-card {
        background: #1f2937;
        border-color: rgba(248, 249, 251, 0.1);
      }
      .sk-line,
      .sk-tile {
        background: linear-gradient(
            90deg,
            rgba(17, 24, 39, 0.06) 0%,
            rgba(17, 24, 39, 0.12) 50%,
            rgba(17, 24, 39, 0.06) 100%
          )
          rgba(17, 24, 39, 0.06);
        background-size: 200% 100%;
        border-radius: 0.5rem;
        animation: sk-shimmer 1.5s ease-in-out infinite;
      }
      html.dark .sk-line,
      html.dark .sk-tile {
        background: linear-gradient(
            90deg,
            rgba(248, 249, 251, 0.06) 0%,
            rgba(248, 249, 251, 0.12) 50%,
            rgba(248, 249, 251, 0.06) 100%
          )
          rgba(248, 249, 251, 0.06);
        background-size: 200% 100%;
      }
      .sk-line--label {
        width: 35%;
        height: 0.75rem;
      }
      .sk-line--input {
        height: 3rem;
        border-radius: 0.75rem;
      }
      .sk-group {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }
      .sk-tiles {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 0.75rem;
      }
      .sk-tile {
        height: 6.5rem;
        border-radius: 1rem;
      }
      @keyframes sk-shimmer {
        0% {
          background-position: 200% 0;
        }
        100% {
          background-position: -200% 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .sk-line,
        .sk-tile {
          animation: none;
        }
      }
      @media (max-width: 430px) {
        .sk-app {
          padding: 0 0.625rem 2rem;
        }
        .sk-card {
          padding: 1.25rem;
          border-radius: 1rem;
        }
        .sk-tiles {
          gap: 0.5rem;
        }
        .sk-tile {
          height: 4.75rem;
          border-radius: 0.75rem;
        }
      }
    </style>
